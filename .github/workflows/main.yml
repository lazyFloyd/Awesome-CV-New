name: Compile PDFs

on:
  pull_request: {}

jobs:
  build:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Compile
      run: make cv.pdf cv-de.pdf

    - uses: actions/upload-artifact@v4
      with:
        name: examples
        path: |
          examples/cv.pdf
          examples/cv-de.pdf
